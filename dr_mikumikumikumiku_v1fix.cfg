;---------------------------------------------------------------------------------------------
; Rotating Platforms
;---------------------------------------------------------------------------------------------
modify:
{
	;Match the conveyor 
    match:
    {
	    "targetname" "miku_platrot1_1"
        "classname" "func_door_rotating"
    }
	;Delete only the sound related stuff. There's an output that open the door.
    delete:
    {
        delete:
    {
        "OnUser3" "!self,FireUser3,,2,-1"
        "OnUser3" "!self,RunScriptCode,self.EmitSound(`Miku.LiqCast`),0,-1"
    }
	;Create the new Outputs
    insert:
    {
		;Stop any existing sound 
        "OnUser3" "!self,RunScriptCode,self.StopSound(`Miku.LiqCast`),0,-1"
		;Start playing the sound with a slight delay.
		"OnUser3" "!self,RunScriptCode,self.EmitSound(`Miku.LiqCast`),0.01,-1"
		;The audio lasts around 3.8 seconds, so we want to loop it in a weird delay so that it's "seamless"
		;won't be as seamless without ambient_generic or the sound itself allows it.
		"OnUser3" "!self,FireUser3,,3.6,-1"
    }
}

